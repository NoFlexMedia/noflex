# SPDX-License-Identifier: AGPL-3.0-only
#
# Holds pull requests until everyone who wrote their commits has signed CLA.md,
# through the `cla` status that scripts/ci/cla.sh sets. pull_request_target gives
# a fork's pull request a token that can write, which is safe only because this
# runs the default branch's script and never checks out the pull request.

name: cla

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  check:
    # A comment only counts on a pull request, and only a signature or `recheck`.
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (contains(github.event.comment.body, 'agree to its terms') || contains(github.event.comment.body, 'recheck')))
    runs-on: ubuntu-latest
    concurrency:
      group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            CLA.md
            scripts/ci/cla.sh
          sparse-checkout-cone-mode: false
      - run: scripts/ci/cla.sh
        env:
          GH_TOKEN: ${{ github.token }}
