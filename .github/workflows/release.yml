# SPDX-License-Identifier: AGPL-3.0-only
#
# Builds the server for Linux and Windows, as bundles, packages, an installer and
# a container image, and the Flutter app for every client target, with the source
# of the third-party code they ship. Pushing a `v*` tag attaches them to a draft
# release for a person to look over and publish, and pushes the image; running it
# by hand just leaves them as this run's artifacts. Any target can fail without
# stopping the others. See docs/PACKAGING.md, which also says what each needs.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  # The Nix shell can't build what runs outside Nix, so most targets install
  # Flutter directly. `check` fails if this drifts from the flake's.
  FLUTTER_VERSION: 3.47.4

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Name the version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' backend/Cargo.toml | head -1)
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compare Flutter with the flake's
        run: |
          flake=$(nix develop .#flutter-check --command flutter --version --machine | sed -n 's/.*"frameworkVersion": "\(.*\)".*/\1/p')
          echo "flake has $flake, this workflow $FLUTTER_VERSION"
          test "$flake" = "$FLUTTER_VERSION"
      # CI runs this as a test, but a tag can be pushed on a commit CI failed.
      - name: Check the record of third-party code against the app
        run: nix develop .#no-flutter --command sh -c 'cd backend && cargo xtask third-party check'
      - run: nix develop .#flutter-check --command sh -c 'cd flutter && flutter pub get && dart run build_runner build && flutter analyze --no-pub && flutter test --no-pub'

  # One web client for every bundle, built in the Nix shell.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - run: nix develop .#no-flutter --command sh -c 'cd web && npm ci --no-audit --no-fund && npm run build'
      - run: mkdir -p dist && mv web/build dist/web && tar -cf dist/web.tar -C dist web
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/web.tar
          retention-days: 1
          if-no-files-found: error

  # The ffmpeg each bundle ships. A cold build compiles every dependency, which
  # takes hours, so the result is kept on a hash of everything that makes it.
  ffmpeg:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, aarch64-unknown-linux-gnu, x86_64-pc-windows-msvc]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Restore ffmpeg
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/ffmpeg-${{ matrix.target }}
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('packaging/ffmpeg/ffmpeg.toml', 'packaging/ffmpeg/build.sh', 'packaging/ffmpeg/build-images.sh', 'packaging/ffmpeg/pipeline/**', 'backend/rust-toolchain.toml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/free-disk
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: nix develop .#no-flutter --command sh -c 'cd backend && cargo xtask ffmpeg-build ${{ matrix.target }} ../dist/ffmpeg-${{ matrix.target }}'
      # An artifact keeps no file modes, so the binaries travel in a tar.
      - run: tar -cf dist/ffmpeg-${{ matrix.target }}.tar -C dist ffmpeg-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: dist/ffmpeg-${{ matrix.target }}.tar
          retention-days: 1
          if-no-files-found: error

  # A bundle per target, smoke-tested on its own platform, then packaged: a .deb
  # and an .rpm for Linux, an installer for Windows. Linux bundles link in the Nix
  # shell against an old glibc; Windows can't use Nix, so takes Rust from rustup.
  server:
    needs: [check, web, ffmpeg]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.web.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      TARGET: ${{ matrix.target }}
      VERSION: ${{ needs.check.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{web,ffmpeg-${{ matrix.target }}}"
          merge-multiple: true
      - run: tar -xf dist/web.tar -C dist && tar -xf "dist/ffmpeg-$TARGET.tar" -C dist
      - if: runner.os == 'Linux'
        uses: ./.github/actions/free-disk
      - if: runner.os == 'Linux'
        uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the bundle
        if: runner.os == 'Linux'
        run: nix develop .#no-flutter --command sh -c "cd backend && cargo xtask bundle $TARGET --ffmpeg ../dist/ffmpeg-$TARGET --web ../dist/web"
      - name: Build the bundle
        if: runner.os == 'Windows'
        working-directory: backend
        run: |
          rustup toolchain install
          cargo xtask bundle "$TARGET" --ffmpeg "../dist/ffmpeg-$TARGET" --web ../dist/web
      # Outside the Nix shell, as someone downloading it would run it.
      - run: packaging/smoke/ffmpeg.sh "dist/noflex-$TARGET/ffmpeg/bin/ffmpeg"
      - run: packaging/smoke/server.sh "dist/noflex-$TARGET"
      - name: Package for apt and dnf
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/release
          mv "dist/noflex-$TARGET.tar.zst" "dist/release/noflex-$VERSION-server-$TARGET.tar.zst"
          nix develop .#no-flutter --command packaging/linux/package.sh "dist/noflex-$TARGET" "$VERSION" dist/release
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: |
          installer=$(cygpath -u "$RUNNER_TEMP")/innosetup-6.7.4.exe
          curl -fsSL -o "$installer" https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          echo "a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c  $installer" | sha256sum -c
          MSYS2_ARG_CONV_EXCL='*' "$installer" /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /CURRENTUSER
      - name: Make the installer
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist/release
          mv "dist/noflex-$TARGET.zip" "dist/release/noflex-$VERSION-server-$TARGET.zip"
          packaging/windows/installer.sh "dist/noflex-$TARGET" "$VERSION" dist/release
      - uses: actions/upload-artifact@v4
        with:
          name: server-${{ matrix.target }}
          path: dist/release/*
          retention-days: 14
          if-no-files-found: error

  # One image for amd64 and arm64, around the Linux bundles. Only a tag pushes it.
  image:
    needs: [check, server]
    if: ${{ !cancelled() && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          pattern: server-*-linux-gnu
          merge-multiple: true
      - name: Unpack a bundle per architecture
        run: |
          for pair in amd64:x86_64 arm64:aarch64; do
            arch=${pair%%:*}
            mkdir -p "dist/image/$arch"
            tar --use-compress-program=zstd -xf "dist/release/noflex-$VERSION-server-${pair#*:}-unknown-linux-gnu.tar.zst" \
              -C "dist/image/$arch" --strip-components=1
          done
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/noflex
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: dist/image
          file: packaging/container/Containerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - if: github.ref_type == 'tag'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/noflex
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/free-disk
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install the release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: flutter/android
        run: |
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > key.properties
      - name: Warn about the debug key
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::No release key in the repository's secrets, so these APKs are debug-signed and can't update one another."
      - run: nix develop .#flutter-android --command packaging/flutter/build.sh android
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/noflex-*
          retention-days: 14
          if-no-files-found: error

  native:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # Older than this and the app links libmpv.so.1, which current
          # distributions no longer ship.
          - { target: linux, os: ubuntu-24.04 }
          - { target: windows, os: windows-latest }
          - { target: macos, os: macos-15 }
          - { target: ios, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install the Linux build's libraries
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libsecret-1-dev libepoxy-dev
      - run: packaging/flutter/build.sh ${{ matrix.target }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/noflex-*
          retention-days: 14
          if-no-files-found: error

  # The LGPL's corresponding source for the native libraries the apps ship, as
  # packaging/third-party/apps.toml records them.
  third-party:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v24
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Gather the apps' third-party sources
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version=${GITHUB_REF_NAME#v}
          else
            version=$(sed -n 's/^version: \([^+]*\).*/\1/p' flutter/pubspec.yaml)
          fi
          nix develop .#no-flutter --command sh -c 'cd backend && cargo xtask third-party source ../dist/third-party-source'
          tar -cf "dist/noflex-$version-third-party-source.tar" -C dist third-party-source
      - uses: actions/upload-artifact@v4
        with:
          name: third-party-source
          path: dist/noflex-*
          retention-days: 14
          if-no-files-found: error

  publish:
    needs: [check, android, native, third-party, server, image]
    if: ${{ !cancelled() && needs.check.result == 'success' && github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # What the server jobs built from, not what a release offers.
      - run: rm -f dist/web.tar dist/ffmpeg-*.tar
      - run: cd dist && sha256sum noflex-* >SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/noflex-*
      - name: Attach to a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # GPL-3.0 section 6(d): directions to ffmpeg's source, next to it.
          notes="The server bundles and packages include FFmpeg under the GPL-3.0. Each one's \`ffmpeg/SOURCE.txt\` says where its source is: FFmpeg, the libraries in it, and the scripts in [packaging/ffmpeg](https://github.com/$GH_REPO/tree/$TAG/packaging/ffmpeg) that built them."
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "NoFlex ${TAG#v}" --notes "$notes" --generate-notes
          gh release upload "$TAG" dist/* --clobber
