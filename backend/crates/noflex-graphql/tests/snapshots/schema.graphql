"""
What deleting their own account asks of the viewer, and what it takes.
"""
type AccountDeletion {
	"""
	Whether `deleteAccount` takes their password. An account that only signs
	in through another service has none, and confirms with its username.
	"""
	passwordRequired: Boolean!
	"""
	Whether they're the last administrator, so deleting their account erases
	the whole server: every account, library, setting and cache, keeping
	only media files and the server's configuration.
	"""
	erasesServer: Boolean!
}

"""
An active playback, for the admin dashboard.
"""
type ActiveStream {
	"""
	Job id for transcodes; a generated id for direct sessions.
	"""
	id: ID!
	user: User!
	work: Work
	mediaFileId: ID!
	"""
	Set for live TV streams.
	"""
	channelId: ID
	"""
	Client/device name from the caller's auth session, if known.
	"""
	device: String
	startedAt: DateTime!
	"""
	Bumped by progress reports and segment fetches.
	"""
	lastActiveAt: DateTime!
	positionMs: Int
	decision: PlaybackDecisionInfo!
	"""
	`None` for direct play.
	"""
	transcode: TranscodeProgress
}

"""
Append-only activity log entry. Server actions, scan
events, and play events all funnel through this shape.
"""
type ActivityEntry {
	id: ID!
	kind: ActivityKind!
	actor: String
	subject: String
	detail: String
	occurredAt: DateTime!
}

type ActivityEntryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ActivityEntryEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [ActivityEntry!]!
}

"""
An edge in a connection.
"""
type ActivityEntryEdge {
	"""
	The item at the end of the edge
	"""
	node: ActivityEntry!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Taxonomy of append-only activity log entries. The
GraphQL `Activity.kind` field renders this as a GQL enum
(`SCAN_COMPLETED`, `PLAY_PROGRESS`, …). `Custom` is the
catch-all for plugins that emit their own event names —
the GQL `From<String>` falls through to it.
"""
enum ActivityKind {
	SCAN_STARTED
	SCAN_COMPLETED
	PLAY_STARTED
	PLAY_PROGRESS
	PLAY_COMPLETED
	ITEM_ADDED
	ITEM_UPDATED
	ITEM_REMOVED
	LIBRARY_CREATED
	LIBRARY_UPDATED
	LIBRARY_DELETED
	"""
	A rotated-away refresh token was presented; its session was
	revoked. `actor` is the session's user, `subject` the session.
	"""
	REFRESH_TOKEN_REUSE
	"""
	An administrator approved a device code as someone else, signing a
	device in for them. `actor` is the administrator, `subject` the
	user the device now belongs to.
	"""
	DEVICE_APPROVED_FOR
	CUSTOM
}

"""
A long-lived programmatic credential. The key hash never leaves the
backend, so it isn't on this type — authentication resolves a row by
hash and the caller checks `revoked_at`.
"""
type ApiKey {
	id: ID!
	userId: ID!
	name: String!
	createdAt: DateTime!
	"""
	`None` while the key is active; `Some` stamps the revocation.
	"""
	revokedAt: DateTime
}

"""
One image a provider offers for a work, registered under `id` so a
client can preview and pick it without ever naming the provider's
handle: only what was offered can be fetched.
"""
type ArtworkCandidate {
	"""
	What `setWorkArtwork` takes. It expires half an hour after it was
	offered.
	"""
	id: ID!
	"""
	The plugin offering it, as `providerAttributions` names it.
	"""
	provider: String!
	kind: ImageKind!
	"""
	ISO 639-1 code of the text on it; null when text-free.
	"""
	language: String
	"""
	The full-size image's, when the provider says.
	"""
	width: Int
	height: Int
	"""
	The provider's own rating, higher is better; comparable only between
	one provider's candidates.
	"""
	score: Float
	"""
	A small rendition for a picker, fetched through its provider,
	relative to this server. Carries a `token` so `<img src>` works.
	"""
	previewUrl: String!
}

"""
Library-level choice between metadata-provider artwork and artwork
found next to the media. Either way the other source fills kinds the
preferred one lacks, and generated art comes last.
"""
enum ArtworkPreference {
	PREFER_PROVIDER
	PREFER_LOCAL
}

"""
Audio codec carried by a `MediaFile`/`Edition` and requested by
client capability declarations. Closed set, same contract as
