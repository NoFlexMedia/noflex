	updateWorkFields(workId: ID!, fields: WorkFieldsInput!): Work!
	"""
	Lock or unlock one field against provider refreshes. Values and
	metadata status are untouched. Admin only.
	"""
	setWorkFieldLock(workId: ID!, field: WorkField!, locked: Boolean!): Work!
	"""
	Begin an external login. `clientNonce` is a fresh random secret
	(at least 32 characters) the browser keeps until
	`completeExternalLogin`. The provider callback redirects to
	`/#external-code=<code>`.
	"""
	startExternalLogin(provider: String!, clientNonce: String!): ExternalAuthStart!
	completeExternalLogin(code: String!, clientNonce: String!, client: String, device: String): LoginResult!
	"""
	Begin linking an external identity to the caller. The provider
	callback redirects to `/#external-link-code=<code>`; nothing is
