	segmentContainer: HlsSegmentContainer!
	videoCodecs: [VideoCodec!]!
	audioCodecs: [AudioCodec!]!
}

"""
Segment format of an HLS rendition. fMP4 is what MSE consumes
natively and the only one that carries HEVC/AV1/VP9; MPEG-TS stays
for clients (and audio codecs) that need it.
"""
enum HlsSegmentContainer {
	FMP4
	TS
}

enum HookKind {
	METADATA
	IMAGE
	SUBTITLE
	POST_SCAN
	NOTIFIER
	USER_LINK
	AUTH
	SCROBBLER
	INTRO_DETECTOR
	EMBEDDER
	BACKGROUND
}

type HostInfo {
	hostname: String
	osName: String
	osVersion: String
	kernelVersion: String
	arch: String!
	bootedAt: DateTime
	uptimeSeconds: Int
}

type Image {
	kind: ImageKind!
	source: ImageSource!
	path: String!
	width: Int
	height: Int
	language: String
	"""
	Serving route for this image, pinned to its source with
	`?source=` (so the URL changes when the effective source does)
	and carrying a `&token=` that authenticates the caller without a
	header (so `<img src>` works) and stays identical for about an
	hour so browsers can cache it. Clients append `&w=`/`&h=` (and
	optionally `&fill=true`) to resize server-side. Without a
	configured signer the token is omitted and the route needs a
	header credential.
	"""
	url: String!
}

"""
Image kinds that can be attached to a target (work, edition, or person).
"""
enum ImageKind {
	PRIMARY
	BACKDROP
	BANNER
	THUMB
	LOGO
	DISC
	BOX
	MENU
	CHAPTER
	ART
}

"""
Where an image came from. A target holds at most one image per
(kind, source), so local and provider artwork of one kind coexist and
readers pick between them by a source order.
"""
enum ImageSource {
	"""
	Found next to the media by the scanner; owned by scan reconcile.
	"""
	LOCAL
	"""
	Fetched from a metadata provider plugin into the image cache.
	"""
	PROVIDER
	"""
	Rendered by the server (e.g. episode frame grabs) as a last resort.
	"""
	GENERATED
}

"""
Closed set of image-target kinds, mirroring [`ImageTarget`]'s
variants — kept separate so the query takes a flat
`(kind, id)` pair instead of a tagged input union.
"""
enum ImageTargetKind {
	WORK
	EDITION
	TAG
}

type IndexScanRun {
	startedAt: DateTime
