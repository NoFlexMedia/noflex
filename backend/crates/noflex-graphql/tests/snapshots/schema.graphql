	Asked of models that can shorten their output; most can't.
	"""
	requestDimensions: Int
	"""
	Put before each query; many models were trained expecting one.
	"""
	queryPrefix: String!
	"""
	Put before each document.
	"""
	documentPrefix: String!
	hasApiKey: Boolean!
}

input EmbeddingEndpointInput {
	"""
	The API's base, such as `https://api.openai.com/v1`.
	"""
	url: String!
	"""
	Null keeps the saved key while `url` is unchanged. Empty removes it.
	"""
	apiKey: String
	model: String!
	"""
	Ask the model to shorten its vectors. Most models can't.
