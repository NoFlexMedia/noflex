"""
enum AudioCodec {
	AAC
	AC3
	EAC3
	MP3
	OPUS
	VORBIS
	FLAC
	TRUEHD
	DTS
	PCM
}

"""
Decoder limits for one audio codec. Without an entry, any channel
count is accepted.
"""
