	id: ID!
	libraryId: ID!
	title: String!
	sortTitle: String!
	overview: String
	createdAt: DateTime!
	updatedAt: DateTime!
	"""
	Visible members in membership order. `first` defaults to
	`ITEM_PAGE_DEFAULT` (50), max `ITEM_PAGE_MAX` (100).
	"""
	items(first: Int, after: String): WorkConnection!
}

type CollectionConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
