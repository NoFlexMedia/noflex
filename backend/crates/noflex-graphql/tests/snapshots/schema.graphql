"""
Container the user asked the worker to produce. MP4 is the
only "fast" target — copy-remux with `+faststart` for direct
browser playback. MKV is allowed for users who want lossless
archival; it goes through the same remux path.
"""
enum ExportFormat {
	MP4
	MKV
}

type ExportJob {
	id: ID!
	userId: ID!
	editionId: ID!
	format: ExportFormat!
	status: ExportJobStatus!
	"""
	0.0..1.0; the worker updates this every progress tick
	(every ~5s) by reading ffmpeg's `time=` stderr field.
	"""
	progress: Float!
	"""
	Absolute path to the produced file. Set by the worker on
	successful completion; `None` while queued/running.
	"""
	outputPath: String
	"""
	Worker-stamped failure message. `None` unless status is
	`Failed`. Truncated stderr from the ffmpeg subprocess.
	"""
	error: String
	createdAt: DateTime!
	startedAt: DateTime
	finishedAt: DateTime
	"""
	The work this was exported from. Null when it no longer exists or
	the viewer can't access it.
	"""
	work: Work
}

type ExportJobConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ExportJobEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [ExportJob!]!
}

"""
An edge in a connection.
"""
type ExportJobEdge {
	"""
	The item at the end of the edge
	"""
	node: ExportJob!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Closed set of durable queue states. `CancelRequested` keeps cancellation
observable until the worker holding the lease has stopped its subprocess.
"""
enum ExportJobStatus {
	QUEUED
	RUNNING
	CANCEL_REQUESTED
	COMPLETED
	FAILED
	CANCELLED
}

"""
Per-job status updates streamed to the `Downloads` UI. The
`DownloadWorker` calls
`ExportEventBroadcaster::emit_status` on every state
transition; this subscription filters the broadcast
channel by job id and yields the matching events.

Filtering happens in the subscription body itself
(rather than in the worker) so the worker can be
fire-and-forget: a slow client doesn't back-pressure the
queue, and an event for a different job never even
crosses the wire.
"""
type ExportStatusEvent {
	id: ID!
	status: ExportJobStatus!
	progress: Float!
}

