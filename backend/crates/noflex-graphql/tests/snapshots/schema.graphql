	A list of edges.
	"""
	edges: [CollectionEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Collection!]!
}

"""
An edge in a connection.
"""
type CollectionEdge {
	"""
	The item at the end of the edge
	"""
	node: Collection!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Color primaries (a.k.a. color space). Defines the gamut; the
HDR10 / Dolby Vision static-metadata path uses `Bt2020`.
"""
enum ColorPrimaries {
	BT_709
	BT_2020
	BT_601_NTSC
	BT_601_PAL
	SMPTE_C
	DCI_P3
	DISPLAY_P3
	BT_470M
	BT_470_BG
	XYZ
	FILM
}

type ConfigEntry {
	"""
	Dotted path, arrays indexed: `transcoder.ladder[0].max_height`.
	"""
	key: String!
	"""
	Scalar rendered as text; `null` for unset options.
	"""
	value: String
	redacted: Boolean!
}

"""
What viewers browse by, across libraries. Every top-level work belongs to
at most one category.
"""
enum ContentCategory {
	"""
	Movies that aren't anime.
	"""
	MOVIES
	"""
	Series that aren't anime.
	"""
	SHOWS
	"""
	Anime movies and series.
	"""
	ANIME
	MUSIC
	AUDIOBOOKS
	PHOTOS
}

"""
How many top-level works in a category a caller can access.
"""
type ContentCategoryCount {
	category: ContentCategory!
	workCount: Int!
}

type CpuCore {
	index: Int!
	"""
	0–100.
	"""
	usagePercent: Float!
	frequencyMhz: Int!
}

type CpuStatus {
	"""
	Whole-machine utilisation, 0–100.
	"""
	usagePercent: Float!
	brand: String!
	physicalCores: Int
	logicalCores: Int!
	cores: [CpuCore!]!
	"""
	`None` where the OS has no load average (Windows).
	"""
	loadAverage: LoadAverage
}

input CreateLiveTvSourceInput {
	name: String!
	playlistUrl: String!
	epgUrl: String
	enabled: Boolean! = true
}

"""
An API key at the only moment its plaintext exists: the create
response. Listings show the `api_key` row, never `key`.
"""
type CreatedApiKey {
	key: String!
	apiKey: ApiKey!
}

type DatabaseStatus {
	backend: String!
	engineVersion: String!
	schemaVersion: Int!
	healthy: Boolean!
	notes: [String!]!
	"""
	Main database file. `None` for engines without a local file.
	"""
	path: String
	"""
	Main file plus write-ahead log, in bytes.
	"""
	sizeBytes: Int
	walSizeBytes: Int
	"""
	Set when the health probe itself failed.
	"""
	error: String
}

"""
A datetime with timezone offset.

The input is a string in RFC3339 format, e.g. "2022-01-12T04:00:19.12345Z"
or "2022-01-12T04:00:19+03:00". The output is also a string in RFC3339
format, but it is always normalized to the UTC (Z) offset, e.g.
"2022-01-12T04:00:19.12345Z".
"""
scalar DateTime

"""
A client registered for smart transcoding and downloads. `id` is chosen by
the client, so it survives signing out.
"""
type Device {
	id: ID!
	name: String!
	"""
	Prepare optimized versions for this device while the server is idle.
	"""
	smartTranscode: Boolean!
	"""
	Lowers what's prepared for this device; unset means its best.
	"""
	maxBitrateBps: Int
	"""
	Restricts the codecs prepared for this device; empty means any it
	supports.
	"""
	allowedVideoCodecs: [VideoCodec!]!
	"""
	Keep likely-watched titles on this device.
	"""
	smartDownloads: Boolean!
	downloadBudgetBytes: Int
	"""
	Enforced by the client, which alone knows its connection.
	"""
	downloadsWifiOnly: Boolean!
	createdAt: DateTime!
	lastSeenAt: DateTime!
}

"""
The device's half of the link flow: show `pin` on screen, then
poll `pollDevicePin` until it yields a session or `expires_at`
passes.
"""
type DevicePinInfo {
	pin: String!
	expiresAt: DateTime!
}

"""
Progressive (`<video src>`) playback of the file as stored.
"""
input DirectPlayProfile {
	"""
	Container family: `mp4` matches every ISO-BMFF file (ffprobe
	calls them all `mov`), `mkv`/`webm`/`matroska` match Matroska,
	`ts` matches MPEG-TS; anything else compares as ffprobe names it.
	"""
	container: String!
	videoCodecs: [VideoCodec!]!
	audioCodecs: [AudioCodec!]!
}

"""
Dolby Vision profile tag. Stored as the integer profile number
(5, 7, 8, 9) in the `editions.dovi_profile` INTEGER column.
"""
enum DolbyVisionProfile {
	PROFILE_5
	PROFILE_7
	PROFILE_8
	PROFILE_9
}

"""
An edition is a specific cut/version of a work. Most works have one
("Default"); collector-grade libraries have multiple ("Theatrical",
"Director's Cut", "Extended").
"""
type Edition {
	id: ID!
	workId: ID!
	name: String!
	runtimeMs: Int
	introStartMs: Int
	introEndMs: Int
	creditsStartMs: Int
	chapters: [Chapter!]!
	"""
	Codec and dimension metadata are promoted off
	`media_files.probe_json` so the direct-play decision can read
	them without a join. Populated by the post_scan ffprobe task; `None` for editions whose
	media files have never been probed.
	"""
	codecVideo: String
	codecAudio: String
	width: Int
	height: Int
	bitDepth: Int
	"""
	Loose free-form HDR description (e.g. "HDR10", "HLG"). Kept
	for back-compat with legacy rows; the typed
	`transfer_characteristics` + `dovi_profile` fields below carry
	the v2 truth. `#[serde(default, skip_serializing_if =
	"Option::is_none")]` so a missing field is invisible on the
	wire — only the typed fields appear once we promote them.
	"""
	hdrFormat: String
	"""
	Per-track audio metadata (language, channels, codec, default).
	`Option<>` here so the legacy case of "no probe yet" round-trips
	without an empty-array column write.
	"""
	audioTracks: [AudioTrack!]
	subtitleTracks: [SubtitleTrack!]
	"""
	Typed video codec (replaces the loose `codec_video` string in
	the new probe pipeline; the string field stays for back-compat).
	"""
	videoCodec: VideoCodec
	"""
	H.264/H.265/AV1/VP9 profile tier.
	"""
	videoProfile: VideoProfile
	"""
	Codec level × 10 (H.264) or × 30 (HEVC). `f32` so we can carry
	the half-step bumps ffmpeg occasionally reports.
	"""
	videoLevel: Float
	"""
	Pixel format / chroma subsampling.
	"""
	pixelFormat: PixelFormat
	"""
	Color primaries (gamut).
	"""
	colorPrimaries: ColorPrimaries
	"""
	Transfer characteristics. The v2 truth; `hdr_format` is the
	legacy free-form string for older rows.
	"""
	transferCharacteristics: HdrTransfer
	"""
	YCbCr ↔ RGB matrix coefficients.
	"""
	matrixCoefficients: MatrixCoefficients
	"""
	Dolby Vision profile tag (5/7/8/9). Stored as INTEGER in SQL.
	"""
	doviProfile: DolbyVisionProfile
	"""
	Max Content Light Level (cd/m²). HDR10 / DV static metadata.
	"""
	maxCll: Int
	"""
	Max Frame-Average Light Level (cd/m²).
	"""
	maxFall: Int
	"""
	Minimum mastering-display luminance, 0.0001 cd/m² resolution
	(stored × 10000 = 0..max). `0.0001` is the SMPTE ST 2086 floor.
	"""
	masteringDisplayMinLuminance: Int
	"""
	Maximum mastering-display luminance, 1 cd/m² resolution.
	"""
	masteringDisplayMaxLuminance: Int
	"""
	Source frame rate (fps). Drives bitrate-vs-resolution math in
	the transcoder's ladder.
	"""
	frameRate: Float
	trickplay: TrickplayAsset
}

"""
One bounded electronic programme guide entry.
"""
type EpgProgram {
	id: ID!
	channelId: ID!
	externalId: String!
	title: String!
	subtitle: String
	description: String
	category: String
	startAt: DateTime!
	endAt: DateTime!
}

type EpgProgramConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [EpgProgramEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [EpgProgram!]!
}

"""
An edge in a connection.
"""
type EpgProgramEdge {
	"""
	The item at the end of the edge
	"""
	node: EpgProgram!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Container the user asked the worker to produce. MP4 is the
only "fast" target — copy-remux with `+faststart` for direct
browser playback. MKV is allowed for users who want lossless
archival; it goes through the same remux path.
"""
enum ExportFormat {
	MP4
	MKV
}

type ExportJob {
	id: ID!
	userId: ID!
	editionId: ID!
	format: ExportFormat!
	status: ExportJobStatus!
	"""
	0.0..1.0; the worker updates this every progress tick
	(every ~5s) by reading ffmpeg's `time=` stderr field.
	"""
	progress: Float!
	"""
	Absolute path to the produced file. Set by the worker on
	successful completion; `None` while queued/running.
	"""
	outputPath: String
	"""
	Worker-stamped failure message. `None` unless status is
	`Failed`. Truncated stderr from the ffmpeg subprocess.
	"""
	error: String
	createdAt: DateTime!
	startedAt: DateTime
	finishedAt: DateTime
}

type ExportJobConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ExportJobEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [ExportJob!]!
}

"""
An edge in a connection.
"""
type ExportJobEdge {
	"""
	The item at the end of the edge
	"""
	node: ExportJob!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Closed set of durable queue states. `CancelRequested` keeps cancellation
observable until the worker holding the lease has stopped its subprocess.
"""
enum ExportJobStatus {
	QUEUED
	RUNNING
	CANCEL_REQUESTED
	COMPLETED
	FAILED
	CANCELLED
}

"""
Per-job status updates streamed to the `Downloads` UI. The
`DownloadWorker` calls
`ExportEventBroadcaster::emit_status` on every state
transition; this subscription filters the broadcast
channel by job id and yields the matching events.

Filtering happens in the subscription body itself
(rather than in the worker) so the worker can be
fire-and-forget: a slow client doesn't back-pressure the
queue, and an event for a different job never even
crosses the wire.
"""
type ExportStatusEvent {
	id: ID!
	status: ExportJobStatus!
	progress: Float!
}

