"""
An active playback, for the admin dashboard.
"""
type ActiveStream {
	"""
	Job id for transcodes; a generated id for direct sessions.
	"""
	id: ID!
	user: User!
	work: Work
	mediaFileId: ID!
	"""
	Set for live TV streams.
	"""
	channelId: ID
	"""
	Client/device name from the caller's auth session, if known.
	"""
	device: String
	startedAt: DateTime!
	"""
	Bumped by progress reports and segment fetches.
	"""
	lastActiveAt: DateTime!
	positionMs: Int
	decision: PlaybackDecisionInfo!
	"""
	`None` for direct play.
	"""
	transcode: TranscodeProgress
}

"""
Append-only activity log entry. Server actions, scan
events, and play events all funnel through this shape.
"""
type ActivityEntry {
	id: ID!
	kind: ActivityKind!
	actor: String
	subject: String
	detail: String
	occurredAt: DateTime!
}

type ActivityEntryConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [ActivityEntryEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [ActivityEntry!]!
}

"""
An edge in a connection.
"""
type ActivityEntryEdge {
	"""
	The item at the end of the edge
	"""
	node: ActivityEntry!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Taxonomy of append-only activity log entries. The
GraphQL `Activity.kind` field renders this as a GQL enum
(`SCAN_COMPLETED`, `PLAY_PROGRESS`, …). `Custom` is the
catch-all for plugins that emit their own event names —
the GQL `From<String>` falls through to it.
"""
enum ActivityKind {
	SCAN_STARTED
	SCAN_COMPLETED
	PLAY_STARTED
	PLAY_PROGRESS
	PLAY_COMPLETED
	ITEM_ADDED
	ITEM_UPDATED
	ITEM_REMOVED
	LIBRARY_CREATED
	LIBRARY_UPDATED
	LIBRARY_DELETED
	"""
	A rotated-away refresh token was presented; its session was
	revoked. `actor` is the session's user, `subject` the session.
	"""
	REFRESH_TOKEN_REUSE
	CUSTOM
}

"""
A long-lived programmatic credential. The key hash never leaves the
backend, so it isn't on this type — authentication resolves a row by
hash and the caller checks `revoked_at`.
"""
type ApiKey {
	id: ID!
	userId: ID!
	name: String!
	createdAt: DateTime!
	"""
	`None` while the key is active; `Some` stamps the revocation.
	"""
	revokedAt: DateTime
}

"""
Library-level choice between metadata-provider artwork and artwork
found next to the media. Either way the other source fills kinds the
preferred one lacks, and generated art comes last.
"""
enum ArtworkPreference {
	PREFER_PROVIDER
	PREFER_LOCAL
}

"""
Audio codec carried by a `MediaFile`/`Edition` and requested by
client capability declarations. Closed set, same contract as
[`VideoCodec`]; probe-side audio codec names stay `String`
because ffprobe reports an open-ended set.
"""
enum AudioCodec {
	AAC
	AC3
	EAC3
	MP3
	OPUS
	VORBIS
	FLAC
	TRUEHD
	DTS
	PCM
}

"""
Decoder limits for one audio codec. Without an entry, any channel
count is accepted.
"""
input AudioCodecSupport {
	codec: AudioCodec!
	maxChannels: Int
}

type AudioTrack {
	language: String
	codec: String!
	channels: Int!
	default: Boolean!
	"""
	Sample bit depth (16 for AAC/Opus/AC-3, 24 for FLAC/TrueHD/MLP).
	"""
	bitDepth: Int
	"""
	Sample rate in Hz; affects DTS-HD MA downmix decisions.
	"""
	sampleRate: Int
	"""
	Speaker / channel layout. `ObjectBased` for JOC/Atmos.
	"""
	channelLayout: ChannelLayout
	"""
	Codec profile (e.g. `"LC-AAC"`, `"HE-AAC"`, `"xHE-AAC"`,
	`"DTS-HD MA"`, `"DTS-HD HRA"`, `"DTS:X"`).
	"""
	codecProfile: String
	"""
	JOC/Atmos metadata: `"joc"` for Atmos, `"none"` otherwise.
	"""
	audioObjectType: String
	"""
	`true` for sidecar files, `false` for muxed-in.
	"""
	external: Boolean!
	"""
	Independent of `default` — a track can be default-non-forced
	OR default-forced (foreign-language subs for non-default audio).
	"""
	forced: Boolean!
	"""
	Human-readable label, e.g. `"Director's Commentary"`.
	"""
	title: String
}

type BinaryInfo {
	"""
	What NoFlex invokes: the configured override or the bare name.
	"""
	command: String!
	"""
	The environment variable that overrides `command`.
	"""
	overrideEnv: String!
	"""
	Absolute path `command` resolves to, when found.
	"""
	path: String
	"""
	First line of `-version`.
	"""
	version: String
	"""
	`--enable-*` flags from the build configuration.
	"""
	buildFlags: [String!]!
	error: String
}

"""
Speaker / channel layout of an audio track. `ObjectBased` is the
JOC / Atmos case (bed+objects rather than a fixed channel count).
"""
enum ChannelLayout {
	MONO
	STEREO
	THREE
	FOUR
	FIVE
	SIX
	SEVEN_ONE
	EIGHT
	OBJECT_BASED
}

type Chapter {
	positionMs: Int!
	title: String
}

"""
What a playback client can play, as the client itself measured it.
The canonical `startPlaybackSession` input type.
"""
input ClientCapabilities {
	"""
	Progressive profiles, tried in order.
	"""
	directPlay: [DirectPlayProfile!]!
	"""
	HLS segment formats, in preference order; ties go to the earlier.
	"""
	hls: [HlsProfile!]!
	videoCodecs: [VideoCodecSupport!]!
	audioCodecs: [AudioCodecSupport!]!
	"""
	Text subtitle formats the client renders itself. Sidecar tracks
	convertible to one of these are delivered out of band rather
	than forcing a transcode.
	"""
	subtitleCodecs: [SubtitleCodec!]!
	"""
	Display ceiling: taller sources are scaled down.
	"""
	maxHeight: Int
	"""
	The restrictions policy clamps this server-side.
	"""
	maxBitrateBps: Int
}

enum CodecMediaKind {
	VIDEO
	AUDIO
}

type CodecSupport {
	"""
	ffmpeg codec name (`hevc_vaapi`, `libx264`, `h264_cuvid`, …).
	"""
	name: String!
	media: CodecMediaKind!
	"""
	`software`, or the hardware backend the codec runs on.
	"""
	backend: String!
	available: Boolean!
}

"""
An admin-curated grouping of works within one library. The ordered
