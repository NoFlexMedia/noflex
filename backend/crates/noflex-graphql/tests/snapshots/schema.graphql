"""
A client registered for smart transcoding and downloads. `id` is chosen by
the client, so it survives signing out.
"""
type Device {
	id: ID!
	name: String!
	"""
	The app it's running, as a session's `client` is. Together with `name`, what
	clients read to tell what kind of device this is.
	"""
	client: String
	"""
	Prepare optimized versions for this device while the server is idle.
	"""
	smartTranscode: Boolean!
	"""
	Lowers what's prepared for this device; unset means its best.
	"""
	maxBitrateBps: Int
	"""
	Restricts the codecs prepared for this device; empty means any it
	supports.
	"""
	allowedVideoCodecs: [VideoCodec!]!
	"""
	Keep likely-watched titles on this device.
	"""
	smartDownloads: Boolean!
	downloadBudgetBytes: Int
	"""
	Enforced by the client, which alone knows its connection.
	"""
	downloadsWifiOnly: Boolean!
	createdAt: DateTime!
	lastSeenAt: DateTime!
}

"""
The device's half of the link flow: show `code` on screen, then
poll `pollDeviceCode` until it yields a session or `expires_at`
passes.
"""
type DeviceCodeInfo {
	code: String!
	expiresAt: DateTime!
}

"""
A command for a device to carry out. Only the fields its `kind` uses are set.
"""
type DeviceCommand {
	kind: DeviceCommandKind!
	"""
	The title to start, on `Load`.
	"""
	workId: ID
	"""
	A cut the viewer picked, on `Load`; the device chooses otherwise.
	"""
	editionId: ID
	"""
	A version the viewer picked, on `Load`; the device chooses otherwise.
	"""
	mediaFileId: ID
	"""
	Where to start on `Load`, or the place to go on `Seek`.
	"""
	positionMs: Int
	issuedAt: DateTime!
}

"""
Something a controlling client asks a device to do.
"""
enum DeviceCommandKind {
	"""
	Start a title: the device picks the version it plays best.
	"""
	LOAD
	PLAY
	PAUSE
	SEEK
	STOP
}

"""
What `controlDevice` may ask of a device that already has something loaded.
"""
enum DeviceControl {
	PLAY
	PAUSE
	SEEK
	STOP
}

"""
What a device is doing, as it last said.
"""
enum DevicePlayState {
	PLAYING
	PAUSED
	BUFFERING
}

"""
What a device is playing. It's the device's own word, refreshed every few
seconds, so a controller advances `positionMs` itself while `PLAYING`.
"""
type DevicePlayback {
	workId: ID!
	state: DevicePlayState!
	positionMs: Int!
	durationMs: Int
	"""
	The server's clock when it heard, so a controller can tell how stale
	`positionMs` is without trusting its own clock.
	"""
	reportedAt: DateTime!
	"""
	The title; null once it's gone, or for a viewer who can't see it.
	"""
	work: Work
}

"""
What a device reports about itself.
"""
input DevicePlaybackInput {
	workId: ID!
	state: DevicePlayState!
	positionMs: Int!
	durationMs: Int
}

"""
Progressive (`<video src>`) playback of the file as stored.
"""
input DirectPlayProfile {
	"""
	Container family: `mp4` matches every ISO-BMFF file (ffprobe
	calls them all `mov`), `mkv`/`webm`/`matroska` match Matroska,
	`ts` matches MPEG-TS; anything else compares as ffprobe names it.
	"""
	container: String!
	videoCodecs: [VideoCodec!]!
	audioCodecs: [AudioCodec!]!
}

"""
A subtitle a viewer fetched from a provider for one media file. The text
lives in the server's own cache, never in the media folder, as UTF-8 in a
format the subtitle pipeline reads. Everyone who can see the title shares
it, and it goes with the media file, or once nobody has used it for a while.
"""
type DownloadedSubtitle {
	id: ID!
	mediaFileId: ID!
	"""
	The plugin it came from.
	"""
	provider: String!
	"""
	ISO 639-2/T.
	"""
	language: String!
	"""
	One of SubRip, WebVTT, ASS and SSA.
	"""
	format: SubtitleCodec!
	"""
	The release it was timed for, as the provider named it.
	"""
	release: String
	hearingImpaired: Boolean!
	forced: Boolean!
	"""
	Matched by the file's hash, so timed for this exact file.
	"""
	hashMatch: Boolean!
	"""
	Who fetched it, while they still have an account.
	"""
	downloadedBy: ID
	createdAt: DateTime!
	"""
	When it was last served or burned in; the sweep removes those unused
	for long enough.
	"""
	lastUsedAt: DateTime!
}

"""
A downloaded subtitle as the media file now lists it.
"""
type DownloadedSubtitleTrack {
	"""
	Its position in `mediaFile.subtitleTracks`, the index `burnSubtitle`
	and `subtitles` use.
	"""
	index: Int!
	track: SubtitleTrack!
	"""
	With its tracks as they now are.
	"""
	mediaFile: MediaFile!
}

"""
An edition is a specific cut of a work. Most works have one ("Default");
collector-grade libraries have multiple ("Theatrical", "Director's Cut",
"Extended"). Encodes of one cut, like 4K HDR and 1080p SDR, are that edition's
[`MediaFile`]s, and what's true of a picture or a track is recorded on them.
"""
type Edition {
	id: ID!
	workId: ID!
	name: String!
	runtimeMs: Int
	introStartMs: Int
	introEndMs: Int
	creditsStartMs: Int
	chapters: [Chapter!]!
	trickplay: TrickplayAsset
}

"""
An OpenAI-compatible embeddings API an administrator chose over the local
embedder. Titles, overviews, credits and search text are sent to it.
