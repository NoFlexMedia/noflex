}

"""
One title's watch state, in terms another server can match.
"""
type WatchSyncItem {
	"""
	Provider IDs of the movie, or of the series for an episode. Paths and
	other server-local IDs never appear here, so nothing syncs on a guess.
	"""
	externalIds: [ExternalId!]!
	"""
	Set for an episode, with `episode`.
	"""
	season: Int
	episode: Int
	played: Boolean!
	positionMs: Int
	lastPlayed: DateTime!
}

"""
One title's watch state, in terms another server can match.
"""
input WatchSyncItemInput {
	"""
	Provider IDs of the movie, or of the series for an episode. Paths and
	other server-local IDs never appear here, so nothing syncs on a guess.
	"""
	externalIds: [ExternalIdInput!]!
	"""
	Set for an episode, with `episode`.
	"""
	season: Int
	episode: Int
	played: Boolean!
	positionMs: Int
	lastPlayed: DateTime!
}

"""
Watched-state filter for one user. `watched` defaults to true;
pass `watched: false` for works the user has not completed
(including never-played).
"""
input WatchedFilterInput {
	"""
	The user whose played state is consulted.
	"""
	userId: ID!
	watched: Boolean
}

enum WatcherState {
	"""
	No watcher is running: watching is disabled, or the library is gone.
	"""
	NOT_STARTED
	ACTIVE
	FAILED
}

"""
A logical work — the abstract thing a user thinks of as "the movie" or
"the episode," regardless of how many files it's stored as.
"""
type Work {
	id: ID!
	kind: WorkKind!
	parentId: ID
	libraryId: ID!
	title: String!
	sortTitle: String!
	year: Int
	releaseDate: String
	overview: String
	tagline: String
	originalTitle: String
	communityRating: Float
	externalIds: [ExternalId!]!
	indexNumber: Int
	"""
	Inclusive last index in a range. `None` for a normal single-indexed
	Work (e.g. one Episode = one number). `Some(end)` when this Work
	represents a range — multi-episode files like `s01e01-e02` land here
	with `index_number = 1, index_end = Some(2)`.
	"""
	indexEnd: Int
	parentIndex: Int
	"""
	Confidence on the canonical fields (`title`, `year`, `overview`).
	Scanner-created rows are always [`MetadataStatus::Unconfirmed`];
	providers and user edits escalate.
	"""
	metadataStatus: MetadataStatus!
	"""
	Fields the user has locked; provider refreshes must not
	overwrite them. Invariant: sorted + deduped (enforced by
	writers, not the type).
	"""
	lockedFields: [WorkField!]!
	addedAt: DateTime!
	updatedAt: DateTime!
	"""
	Who to credit for what this work shows: the provider of its metadata,
	then the providers of any artwork in use from elsewhere. A provider
	that asked for no credit is left out.
	"""
	attributions: [ProviderAttribution!]!
	"""
	People credited on this work, in billing order, one entry per part.
	Empty when no provider named any.
	"""
	credits: [Credit!]!
	"""
	This work's tags in the given namespaces (`genre`, `parental`, `studio`,
	…), ordered by namespace then name.
	"""
	tags(namespaces: [String!]!): [Tag!]!
	"""
	The effective image of each kind attached to this work (posters,
	backdrops, logos, …) under its library's artwork preference,
	ordered by kind.
	"""
	images: [Image!]!
	"""
	The requesting user's play state for this work itself (not its
	editions). Null when the request is unauthenticated.
	"""
	userData: UserData
	"""
	Runtime of the work's first edition (in `editions` order), so
	clients can render `userData.positionMs / runtimeMs`. Null when
	the work has no edition or the first has no known runtime.
	"""
	runtimeMs: Int
	"""
	Provider IDs of the series this episode belongs to, which identify it
	across servers together with its season and episode numbers. Empty
	for anything but an episode. Paths and other server-local IDs never
	appear.
	"""
	seriesExternalIds: [ExternalId!]!
	"""
	Title of the series this episode belongs to, for showing an episode
	away from its series. Null for anything but an episode.
	"""
	seriesTitle: String
	"""
	What the server is still doing to this newly found work; null once
	it has done what it can, whether or not it found a match. Read from
	memory, so it costs a list of cards nothing.
	"""
	indexing: IndexingStage
}

type WorkConnection {
	"""
	Information to aid in pagination.
	"""
	pageInfo: PageInfo!
	"""
	A list of edges.
	"""
	edges: [WorkEdge!]!
	"""
	A list of nodes.
	"""
	nodes: [Work!]!
}

"""
An edge in a connection.
"""
type WorkEdge {
	"""
	The item at the end of the edge
	"""
	node: Work!
	"""
	A cursor for use in pagination
	"""
	cursor: String!
}

"""
Something a work can be filtered by. Values are portable between servers
(slugs, titles, codec names), never server-local ids.
"""
enum WorkFacet {
	"""
	Words the title contains, ignoring case.
	"""
	TITLE
	"""
	A `genre` tag's slug.
	"""
	GENRE
	"""
	A `mood` tag's slug.
	"""
	MOOD
	"""
	A `studio` tag's slug.
	"""
	STUDIO
	"""
	A `parental` tag's slug.
	"""
	CONTENT_RATING
	"""
	A `person` tag's slug, credited as director.
	"""
	DIRECTOR
	"""
	A `person` tag's slug, credited as actor.
	"""
	ACTOR
	"""
	A `person` tag's slug, credited as writer.
	"""
	WRITER
	"""
	A `person` tag's slug, credited as producer.
	"""
	PRODUCER
	"""
	A collection's title, ignoring case.
	"""
	COLLECTION
	"""
	An edition's name, like "Director's Cut".
	"""
	EDITION
	"""
	`YYYY`, `YYYY-YYYY`, `YYYY-` or `-YYYY`, inclusive.
	"""
	YEARS
	"""
	A community rating floor; unrated works never match.
	"""
	MIN_RATING
	"""
	Added to the library within this many days.
	"""
	ADDED_WITHIN_DAYS
	"""
	`unwatched`, `in_progress` or `watched`, for the query's viewer. A series
	is watched once every episode is, and in progress once any has been started.
	"""
	WATCH_STATE
	"""
	Favorited by the query's viewer. The value is ignored.
	"""
	FAVORITE
	"""
	`unmatched` for works no provider has confirmed, or `matched`.
	"""
	MATCH_STATUS
	"""
	`8k`, `4k`, `1440p`, `1080p`, `720p` or `sd`.
	"""
	RESOLUTION
	"""
	`dolby_vision`, `hdr10`, `hlg` or `sdr`. HDR10+ isn't probed, so it reads as `hdr10`.
	"""
	DYNAMIC_RANGE
	"""
	A codec name as probed, like `h265`.
	"""
	VIDEO_CODEC
	"""
	A codec name as probed, like `eac3`.
	"""
	AUDIO_CODEC
	"""
	`atmos`, `7.1`, `5.1`, `stereo` or `mono`, or a channel count for anything else.
	"""
	AUDIO_LAYOUT
	"""
	Any spelling of a language code.
	"""
	AUDIO_LANGUAGE
	"""
	A codec name as probed, or as the sidecar's extension gave it.
	"""
	SUBTITLE_CODEC
	"""
	Any spelling of a language code. Sidecar files count.
	"""
	SUBTITLE_LANGUAGE
}

"""
A value a facet can take among some works.
"""
type WorkFacetValue {
	"""
	What to send back in a [`WorkRule`].
	"""
	value: String!
	"""
	The display name where the server knows one, otherwise `value`.
	"""
	label: String!
	"""
	Top-level works with this value.
	"""
	workCount: Int!
}

"""
The values one facet takes among some works, most common first.
"""
type WorkFacetValues {
	facet: WorkFacet!
	values: [WorkFacetValue!]!
	"""
	More values exist than the most common ones listed here.
	"""
	truncated: Boolean!
}

"""
The per-work metadata fields a user can lock against provider
refreshes: once locked, a refresh must not overwrite that field.
[`ExternalId`] is deliberately absent — external IDs are always
merged, never overwritten. The `*Image` fields lock the work's provider
image of that kind, which picking one by hand does.
"""
enum WorkField {
	TITLE
	SORT_TITLE
	ORIGINAL_TITLE
	YEAR
	RELEASE_DATE
	OVERVIEW
	TAGLINE
	COMMUNITY_RATING
	GENRES
	STUDIOS
	PEOPLE
	PARENTAL_RATING
	PRIMARY_IMAGE
	BACKDROP_IMAGE
	BANNER_IMAGE
	THUMB_IMAGE
	LOGO_IMAGE
}

"""
Manual field edits for a work. Every field left `null` keeps its
current value — clearing a field is not supported. Each provided
field is also locked against future provider refreshes and flips the
work's metadata status to `USER_EDITED`.
"""
input WorkFieldsInput {
	title: String
	sortTitle: String
	originalTitle: String
	year: Int
	"""
	ISO 8601 date string (e.g. `1999-03-31`).
	"""
	releaseDate: String
	overview: String
	tagline: String
	communityRating: Float
}

input WorkFilterInput {
	"""
	Restrict to children of this work (e.g. episodes of a season).
	"""
	parentId: ID
	"""
	Restrict to works carrying this tag.
	"""
	tag: ID
	kinds: [WorkKind!]
	yearMin: Int
	yearMax: Int
	"""
	Only works this user has favorited.
	"""
	favoriteFor: ID
	"""
	Filter by one user's watched state.
	"""
	watched: WatchedFilterInput
	"""
	Inclusive bounds on community rating; unrated works are
	excluded whenever a bound is set.
	"""
	ratingMin: Float
	ratingMax: Float
	"""
	Inclusive bounds on when the work was added to the library.
	"""
	addedAfter: DateTime
	addedBefore: DateTime
	"""
	Conditions on what a work is and how the caller has watched it. Unlike
	the fields above, their values mean the same on every server.
	"""
	rules: WorkRuleGroupInput
	"""
	Include descendant works (episodes under seasons, …); defaults
	to true.
	"""
	recursive: Boolean
}

"""
What a Work *is*. Drives scanner heuristics and metadata provider selection.
"""
enum WorkKind {
	MOVIE
	SERIES
	SEASON
	EPISODE
	ALBUM
	TRACK
	ARTIST
	AUDIO_BOOK
	PHOTO
}

enum WorkKindFilter {
	MOVIE
	SERIES
	SEASON
	EPISODE
	ALBUM
	TRACK
	ARTIST
	AUDIO_BOOK
	PHOTO
}

"""
Conditions combined by `match`, which may themselves be groups.
"""
input WorkRuleGroupInput {
	"""
	Defaults to `ALL`.
	"""
	match: MatchMode
	rules: [WorkRuleInput!]
	groups: [WorkRuleGroupInput!]
}

"""
A condition on one facet: `match` of `values` must apply to the work.
`workFacets` lists the values worth offering.
"""
input WorkRuleInput {
	facet: WorkFacet!
	values: [String!]!
	"""
	Defaults to `ANY`.
	"""
	match: MatchMode
}

"""
Directs the executor to include this field or fragment only when the `if` argument is true.
"""
directive @include(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Directs the executor to skip this field or fragment when the `if` argument is true.
"""
directive @skip(if: Boolean!) on FIELD | FRAGMENT_SPREAD | INLINE_FRAGMENT
"""
Provides a scalar specification URL for specifying the behavior of custom scalar types.
"""
directive @specifiedBy(url: String!) on SCALAR
schema {
	query: Query
	mutation: Mutation
	subscription: Subscription
}

