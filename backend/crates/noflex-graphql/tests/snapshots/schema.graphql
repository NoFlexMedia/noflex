	UNCONFIRMED
	CONFIRMED
	USER_EDITED
}

type Mutation {
	completeSetupWizard(username: String!, password: String!): SetupResult!
	createLibrary(name: String!, kind: LibraryKind!, paths: [String!]!): Library!
	updateLibrary(id: ID!, name: String, kind: LibraryKind, paths: [String!]): Library!
	deleteLibrary(id: ID!): Boolean!
	updateLibraryConfig(id: ID!, preferredLanguages: [String!], preferredProviders: [String!], excludedFolders: [String!], watchEnabled: Boolean, scanSchedule: ScanSchedule, artworkPreference: ArtworkPreference, contentCategory: LibraryCategory): Library!
	"""
	Persist a per-(plugin, hook, work_kind) priority override
	to the storage. Returns the full active table after the write
	so the admin UI can re-render without a follow-up query.
	"""
	setPluginOverride(pluginId: String!, hook: HookKind!, workKind: WorkKindFilter!, priority: Int!): [PluginOverrideEntry!]!
	"""
	Remove an admin priority override (persisted and live), reverting
	that (plugin, hook, work kind) to its manifest/config priority.
	Clearing an override that doesn't exist is a no-op. Admin only.
	"""
	clearPluginOverride(pluginId: String!, hook: HookKind!, workKind: WorkKindFilter!): [PluginOverrideEntry!]!
	triggerLibraryScan(id: ID!): LibraryScanStatus!
	"""
	Enqueue a new export job. The worker
	(`DownloadWorker` in `noflex-server`) picks it up on its
	next poll, runs ffmpeg, and stamps the row through
	`Completed` / `Failed` / `Cancelled`. The mutation
	returns the freshly-created `ExportJob` with `status =
	Queued` so the caller can `subscribe` to its progress.
	"""
	createExportJob(editionId: ID!, format: ExportFormat!): ExportJob!
	cancelExportJob(id: ID!): ExportJob!
	"""
	Report the current playback position for a work or edition.
	`state: STOPPED` additionally logs a `play.progress` activity
	row so the activity feed reflects the session end.
	"""
	reportProgress(target: PlayTargetInput!, positionMs: Int!, state: PlaybackState!): UserData!
	"""
	Flag a work or edition as fully played.
	"""
	markPlayed(target: PlayTargetInput!): UserData!
	"""
	Clear the played flag on a work or edition.
	"""
	markUnplayed(target: PlayTargetInput!): UserData!
	"""
	Start a playback session for a media file. The server decides
	direct play vs. HLS from the stored probe and the client's
	self-measured `capabilities`, spawning an HLS job when needed.
	`burnSubtitle` indexes the media file's subtitle tracks and
	forces a video re-encode; text tracks are otherwise delivered
	out of band through `subtitles`. `decision` explains the route.
	`startPositionMs` starts a transcode at that source position, so
	resuming or seeking far ahead doesn't wait for ffmpeg to catch
	up; the session's `startPositionMs` is the offset actually used.
	"""
	startPlaybackSession(mediaFileId: ID!, capabilities: ClientCapabilities!, burnSubtitle: Int, startPositionMs: Int): PlaybackSession!
	"""
	End a session started by `startPlaybackSession`, stopping its
	transcode job if it has one.
	"""
	stopPlaybackSession(sessionId: ID!): Boolean!
	"""
	Set or clear the favorite flag on a work or edition.
	"""
	setFavorite(target: PlayTargetInput!, favorite: Boolean!): UserData!
	"""
	Register this client, or refresh what it can play. Clients choose
	`id` once and keep it across sign-ins; re-registering keeps the
	device's settings. An id already registered to someone else fails.
	"""
	registerDevice(id: ID!, name: String!, capabilities: ClientCapabilities!): Device!
	"""
	Change one of the caller's devices; omitted settings stay. Pass
	`clearMaxBitrate` or `clearDownloadBudget` to remove a limit.
	"""
	updateDevice(id: ID!, smartTranscode: Boolean, maxBitrateBps: Int, clearMaxBitrate: Boolean, allowedVideoCodecs: [VideoCodec!], smartDownloads: Boolean, downloadBudgetBytes: Int, clearDownloadBudget: Boolean, downloadsWifiOnly: Boolean): Device!
	"""
	Forget one of the caller's devices. Returns whether there was one.
	"""
	removeDevice(id: ID!): Boolean!
	login(username: String!, password: String!, client: String, device: String): LoginResult!
	"""
	Exchange a live refresh token for a fresh token pair. The
	session row is rotated in place — same id, new hash, new
	expiry — so the presented token dies the moment it succeeds,
	and a revoked or expired session can never refresh again. Expiry
	slides by the refresh TTL but never past the session's absolute
	lifetime, after which the user must sign in again.
	
	Every rejection carries the message "invalid refresh token" and
	an `extensions.code`: `REFRESH_TOKEN_INVALID` (unknown, expired,
	or revoked), `REFRESH_TOKEN_SUPERSEDED` (a concurrent refresh with
	the same token won; the session lives on under the winner's
	token), or `REFRESH_TOKEN_REUSED` (a rotated-away token was
	replayed; the whole session has been revoked).
	"""
	refreshSession(refreshToken: String!): LoginResult!
	"""
	Revoke the session backing the caller's token, killing its access
	and refresh tokens. Returns `true` when a session was revoked,
	`false` for an API-key caller (no session to revoke). Requires
	authentication.
	"""
	logout: Boolean!
	"""
	Create a user. `is_admin` is derived from `role` so the two
	never drift apart. Admin only.
	"""
	createUser(username: String!, password: String!, role: UserRole!): User!
	"""
	Update a user's role and/or library grants. Both optional;
	`libraryIds` is the full desired set, diffed against the
	stored grants. Admin only.
	"""
	updateUser(id: ID!, role: UserRole, libraryIds: [ID!]): User!
	"""
	Delete a user. Refuses the caller's own account and the last
	administrator; sessions cascade away with the row. Admin only.
	"""
	deleteUser(id: ID!): Boolean!
	"""
	Change the caller's own password. Revokes every session except
	the caller's current one, signing other devices out on their next
	request. API keys are not revoked.
	"""
	changePassword(currentPassword: String!, newPassword: String!): Boolean!
	setPreference(key: String!, value: JSON!): UserPreference!
	deletePreference(key: String!): Boolean!
	"""
	Create a collection in a library. `sortTitle` defaults to
	`title`. Admin only.
	"""
	createCollection(libraryId: ID!, title: String!, sortTitle: String, overview: String): Collection!
	"""
	Rename / re-annotate a collection. Unpassed fields keep their
	current values. Admin only.
	"""
	updateCollection(id: ID!, title: String, sortTitle: String, overview: String): Collection!
	"""
	Delete a collection and its membership list. False when the id
	didn't exist. Admin only.
	"""
	deleteCollection(id: ID!): Boolean!
	"""
	Replace a collection's membership wholesale. Every id must
	resolve and belong to the collection's library; the error
	names the first id that doesn't. Admin only.
	"""
	setCollectionItems(id: ID!, workIds: [ID!]!): Collection!
	"""
	Create a playlist owned by the caller.
	"""
	createPlaylist(title: String!, overview: String): Playlist!
	"""
	Rename / re-annotate a playlist. Owner or admin only.
	"""
	updatePlaylist(id: ID!, title: String, overview: String): Playlist!
	"""
	Delete a playlist and its entries. False when the id didn't
	exist. Owner or admin only.
	"""
	deletePlaylist(id: ID!): Boolean!
	"""
	Replace a playlist's entries wholesale. Every target must
	resolve; the error names the first id that doesn't. Owner or
	admin only.
	"""
	setPlaylistItems(id: ID!, items: [PlayTargetInput!]!): Playlist!
	"""
	Append entries to the end of a playlist. Same validation as
	`setPlaylistItems`. Owner or admin only.
	"""
	addPlaylistItems(id: ID!, items: [PlayTargetInput!]!): Playlist!
	"""
	Mint an API key for the calling user. The plaintext `key`
	appears in this response and nowhere else, ever.
	"""
	createApiKey(name: String!): CreatedApiKey!
	"""
	Revoke an API key. `false` when the id was unknown or already
	revoked. Non-admins can only reach their own keys and get a
	uniform "not found" otherwise, so keys aren't enumerable;
	admins revoke by id directly.
	"""
	revokeApiKey(id: ID!): Boolean!
	"""
	Begin the device-link flow: an unauthenticated device (a TV
	with no credentials yet) asks for a PIN to show on screen.
	"""
	createDevicePin(client: String, device: String): DevicePinInfo!
	"""
	Attach the calling user to a pending PIN. `false` for unknown,
	expired, or already-authorized codes — deliberately
	indistinguishable.
	"""
	authorizeDevicePin(pin: String!): Boolean!
	"""
	The device side of the link flow, unauthenticated. Null while
	the PIN is pending, unknown, or expired. Once authorized, the
	first poll mints a session for the bound user (carrying the
	PIN's client/device), consumes the PIN, and returns the same
	token pair `login` issues — later polls see null again.
	"""
	pollDevicePin(pin: String!): LoginResult
	"""
	Delete a work and its editions and media-file rows. Admin only.
	With `deleteFile`, also removes every backing file from disk;
	without it, the row-only cleanup resurrects on the next library
	scan while the files remain on disk and is not media removal.
	"""
	deleteWork(id: ID!, deleteFile: Boolean!): Boolean!
	"""
	Delete an edition and its media-file rows. Admin only. With
	`deleteFile`, also removes every backing file from disk; without
	it, the row-only cleanup resurrects on the next library scan while
	the files remain on disk and is not media removal.
	"""
	deleteEdition(id: ID!, deleteFile: Boolean!): Boolean!
	"""
	Delete a media-file row. Admin only. With `deleteFile`, also
	removes its backing file from disk; without it, the row-only
	cleanup resurrects on the next library scan while the file remains
	on disk and is not media removal.
	"""
	deleteMediaFile(id: ID!, deleteFile: Boolean!): Boolean!
