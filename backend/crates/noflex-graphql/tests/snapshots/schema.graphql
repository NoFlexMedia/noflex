"""
Video codec carried by a `MediaFile`/`Edition`. Closed set; the
transcoder's `decide()` function in `noflex-transcoder` reads these
directly to pick a direct-play vs. transcode route.
"""
enum VideoCodec {
	H264
	H265
	AV1
	VP9
	VP8
	MPEG2
	PRORES
	THEORA
}

"""
Decoder limits for one video codec, applied wherever the codec is
listed. A codec with no entry is unconstrained except for range,
which defaults to SDR only.
"""
input VideoCodecSupport {
	codec: VideoCodec!
	"""
	Decodable profiles. Empty accepts any; a source whose profile
	ffprobe couldn't name is accepted.
	"""
	profiles: [VideoProfile!]!
	"""
	In ffprobe's `level` units: H.264 level×10, HEVC level×30
	(`general_level_idc`), AV1 `seq_level_idx`, VP9 level×10.
	"""
	maxLevel: Float
	maxBitDepth: Int
	maxWidth: Int
	maxHeight: Int
	"""
	Ranges decoder and display can present; SDR is implied.
	"""
	videoRanges: [VideoRange!]!
}

"""
H.264/H.265/AV1/VP9 codec profile tier. Drives direct-play
decisions (e.g. a 10-bit HEVC Main stream on a Main10-only client).
"""
enum VideoProfile {
	H264_BASELINE
	H264_CONSTRAINED_BASELINE
	H264_MAIN
	H264_HIGH
	H264_HIGH10
	HEVC_MAIN
	HEVC_MAIN10
	HEVC_HIGH
	HEVC_HIGH10
	AV1_MAIN
	AV1_HIGH
	AV1_PROFESSIONAL
	VP9_PROFILE0
	VP9_PROFILE1
	VP9_PROFILE2
	VP9_PROFILE3
}

"""
Dynamic-range type of a video stream; mirrors Jellyfin's
`VideoRangeType`. The `DoviWith*` variants are Dolby Vision streams
whose base layer is independently presentable as the named range
(profile 8.x, 7, 9), so a client without Dolby Vision can still
play the base layer untouched.
"""
enum VideoRange {
	SDR
	HDR10
	HDR10_PLUS
	HLG
	DOVI
	DOVI_WITH_SDR
	DOVI_WITH_HDR10
	DOVI_WITH_HLG
}

