[package]
name = "noflex-auth-oidc"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "OpenID Connect external authentication for NoFlex"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
url = "2"
