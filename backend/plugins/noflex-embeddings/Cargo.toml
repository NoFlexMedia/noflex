[package]
name = "noflex-embeddings"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Local embedding provider (EmbeddingGemma 2) for NoFlex (WASM plugin)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }

# See noflex-metadata-tmdb for why this must stay a single direct
# wit-bindgen dep with exactly these features.
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async"] }

# tokenizers requires exactly one regex backend, and its other features force
# `esaxx_fast`, a C++ suffix-array build that cannot link on wasm32-wasip2 (no
# wasi libc++). The pure-Rust backend needs neither.
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

# Keep debug info in the released `.wasm` so trap backtraces include
# the source-level function names and (with WASMTIME_BACKTRACE_DETAILS=1)
# panic messages — invaluable for diagnosing the cabi_realloc-class traps.
[profile.release]
debug = true
strip = "none"

[package.metadata.noflex-plugin]
# The xtask reads this section to know what manifest to embed in the
# `noflex:manifest` custom section of the final `.wasm`. See
# `xtask/src/main.rs` (PluginManifestSnippet) — its schema has no
# `[embedding]` table, so the namespace/model/dimensions claim lives
# only in `src/manifest.toml`.
plugin_id = "embeddings"
display_name = "Local Embeddings (EmbeddingGemma 2)"
hooks = ["embedder"]
capabilities = ["assets.read", "inference.run"]
memory_limit_mb = 512
