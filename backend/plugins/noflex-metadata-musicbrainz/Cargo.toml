[package]
name = "noflex-metadata-musicbrainz"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "MusicBrainz metadata provider for NoFlex (WASM plugin)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
