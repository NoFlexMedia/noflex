manifest_version = 1
plugin_id = "tmdb"
display_name = "The Movie Database"
version = "0.0.1"
noflex_api_version = "0.2"
hooks = ["metadata", "image"]
capabilities = ["http.egress", "secrets.read"]
http_egress_hosts = ["api.themoviedb.org", "image.tmdb.org"]
secrets_read = ["api_key"]
license = "AGPL-3.0-only"

[priority]
metadata = 100
image    = 80

[[settings]]
key = "api_key"
label = "API key"
description = "Your own read access token or v3 key from themoviedb.org. Without one, NoFlex uses its shared key, which is for non-commercial use only."
kind = "secret"
