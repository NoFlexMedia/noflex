[package]
name = "noflex-metadata-tvdb"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "TheTVDB metadata + image provider for NoFlex (WASM plugin)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async", "async-spawn"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep debug info in the released `.wasm` so trap backtraces name functions.
[profile.release]
debug = true
strip = "none"

[package.metadata.noflex-plugin]
plugin_id = "tvdb"
display_name = "TheTVDB"
hooks = ["metadata", "image"]
capabilities = ["http.egress", "secrets.read"]
http_egress_hosts = ["api4.thetvdb.com", "artworks.thetvdb.com"]
secrets_read = ["api_key", "pin"]

[package.metadata.noflex-plugin.priority]
metadata = 90
image    = 90
