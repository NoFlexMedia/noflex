[package]
name = "noflex-metadata-tvdb"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "TheTVDB metadata + image provider for NoFlex (WASM plugin)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[package.metadata.noflex-plugin]
plugin_id = "tvdb"
display_name = "TheTVDB"
hooks = ["metadata", "image"]
capabilities = ["http.egress", "secrets.read"]
http_egress_hosts = ["api4.thetvdb.com", "artworks.thetvdb.com"]
secrets_read = ["tvdb.api_key", "tvdb.pin"]

[package.metadata.noflex-plugin.priority]
# TVDB is the historical source-of-truth for TV; on movies it lags TMDb,
# so manifest default biases series higher than movies. Server config can
# override per work-kind.
metadata = 90
image    = 90
