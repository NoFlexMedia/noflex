manifest_version = 1
plugin_id = "tvdb"
display_name = "TheTVDB"
version = "0.0.1"
noflex_api_version = "0.2"
hooks = ["metadata", "image"]
capabilities = ["http.egress", "secrets.read"]
http_egress_hosts = ["api4.thetvdb.com", "artworks.thetvdb.com"]
secrets_read = ["api_key", "pin"]
license = "AGPL-3.0-only"

[priority]
metadata = 90
image    = 90

[[settings]]
key = "api_key"
label = "API key"
description = "Your own key from thetvdb.com. Without one, NoFlex uses its shared key."
kind = "secret"

[[settings]]
key = "pin"
label = "Subscriber PIN"
description = "Only needed with a user-supported key."
kind = "secret"
