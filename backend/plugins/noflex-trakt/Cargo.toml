[package]
name = "noflex-trakt"
version = "0.0.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Trakt scrobbling, history and ratings sync, and device-flow account linking for NoFlex (WASM plugin)"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
noflex-plugin-sdk = { path = "../../crates/noflex-plugin-sdk" }

# See noflex-metadata-tmdb for why this must stay a single direct
# wit-bindgen dep with exactly these features.
wit-bindgen = { version = "0.60", default-features = false, features = ["macros", "realloc", "bitflags", "async"] }

# serde_json also backs the host-runnable unit tests in `api.rs`; it is
# pure Rust and compiles clean for wasm32-wasip2.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Keep debug info in the released `.wasm` so trap backtraces include
# the source-level function names and (with WASMTIME_BACKTRACE_DETAILS=1)
# panic messages — invaluable for diagnosing the cabi_realloc-class traps.
[profile.release]
debug = true
strip = "none"

[package.metadata.noflex-plugin]
# The xtask reads this section to know what manifest to embed in the
# `noflex:manifest` custom section of the final `.wasm`. The canonical
# manifest is `src/manifest.toml`; keep the two in sync.
plugin_id = "trakt"
display_name = "Trakt"
hooks = ["scrobbler", "user-link", "background"]
capabilities = ["http.egress", "secrets.read", "user-secrets.read", "user-secrets.write", "background", "user-state.read", "user-state.write"]
http_egress_hosts = ["api.trakt.tv"]
secrets_read = ["client_id", "client_secret"]
user_secrets_read = ["access_token", "refresh_token", "sync_state"]
user_secrets_write = ["access_token", "refresh_token", "sync_state"]
tasks = [{ name = "poll-link", interval_ms = 5000 }, { name = "sync", interval_ms = 900000, per_user = true }]
deadlines_secs = { background = 120 }
