manifest_version = 1
plugin_id = "webhook"
display_name = "Webhook Notifier"
version = "0.0.1"
noflex_api_version = "0.2"
hooks = ["notifier"]
capabilities = ["http.egress", "http.private-network", "secrets.read"]
# Unrestricted egress is deliberate here: the operator's configured URL
# IS the grant — a webhook bridge cannot enumerate its destinations at
# build time (any Gotify/ntfy/Discord/Slack endpoint, LAN hosts
# included). The host warns at load about the unrestricted grant and
# audit-logs every request, so the audit log is the record of where
# events actually went.
http_egress_hosts = ["*"]
secrets_read = ["auth_token"]
license = "AGPL-3.0-only"
# No `events` key: subscribe to every event kind.

[[settings]]
key = "url"
label = "URL"
description = "Every event is posted here as JSON."
kind = "url"
required = true

[[settings]]
key = "auth_token"
label = "Bearer token"
description = "Sent in an Authorization header with every post, if set."
kind = "secret"
