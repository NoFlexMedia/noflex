include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Ferry output, regenerated by build_runner and gitignored.
    - "lib/graphql/**/__generated__/**"
    - "lib/graphql/__generated__/**"
    - build/**
    - android/**
    - ios/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
