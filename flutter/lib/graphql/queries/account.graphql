#import 'fragments/device_fields.graphql'
#import 'fragments/linked_server_fields.graphql'

query Account {
  preferences { key value updatedAt }
  myDevices { ...DeviceFields }
  mySessions { id client device deviceId appVersion remoteAddr createdAt lastSeenAt expiresAt }
  myRestrictions { maxStreamBitrateBps maxConcurrentTranscodes allowUnrated }
  linkedServers { ...LinkedServerFields }
  exportJobs(first: 100) { nodes { id editionId format status progress error createdAt finishedAt } }
}
