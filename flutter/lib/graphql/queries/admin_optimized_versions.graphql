query AdminOptimizedVersions($after: String) {
  optimizedVersionStats { ready queued running failed readyBytes }
  optimizedVersions(first: 25, after: $after) {
    nodes {
      id
      variantKey
      status
      progress
      sizeBytes
      error
      description
      lastUsedAt
      finishedAt
      work { id title }
    }
    pageInfo { hasNextPage endCursor }
  }
}
