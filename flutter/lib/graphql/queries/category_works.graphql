#import 'fragments/work_card.graphql'

query CategoryWorks($category: ContentCategory!, $filter: WorkFilterInput, $sort: SortOrder, $after: String) {
  works(category: $category, filter: $filter, sort: $sort, first: 48, after: $after) {
    nodes { ...WorkCard }
    pageInfo { hasNextPage endCursor }
  }
}
