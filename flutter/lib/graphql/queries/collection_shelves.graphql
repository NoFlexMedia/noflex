# Nested pages multiply against the request budget, so a shelf holds a taste and
# a screenful of shelves comes at a time. Opening one pages through it properly.
#import 'fragments/work_card.graphql'

query CollectionShelves($library: ID!, $after: String) {
  collections(libraryId: $library, first: 6, after: $after) {
    nodes { id title overview items(first: 8) { nodes { ...WorkCard } pageInfo { hasNextPage } } }
    pageInfo { hasNextPage endCursor }
  }
}
