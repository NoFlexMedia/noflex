#import 'fragments/provider_attribution_fields.graphql'

query MetadataSearch($query: String!, $kind: WorkKind!, $year: Int) {
  searchMetadata(query: $query, kind: $kind, year: $year) {
    externalId { kind value }
    title
    year
    confidence
    provider
  }
  providerAttributions { ...ProviderAttributionFields }
}
