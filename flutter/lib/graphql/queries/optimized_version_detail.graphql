query OptimizedVersionDetail($id: ID!) {
  optimizedVersion(id: $id) {
    id
    unwantedSince
    targets { user { id name username avatarUrl } reason device { id name } }
    marks { user { id name username avatarUrl } work { id title } device { id name } }
  }
}
