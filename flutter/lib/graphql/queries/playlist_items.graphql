#import 'fragments/work_card.graphql'

query PlaylistItems($id: ID!, $after: String) {
  playlist(id: $id) {
    id
    title
    overview
    items(first: 60, after: $after) {
      nodes { kind work { ...WorkCard } }
      pageInfo { hasNextPage endCursor }
    }
  }
}
