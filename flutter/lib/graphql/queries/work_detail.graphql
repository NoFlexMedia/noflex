#import 'fragments/edition_full.graphql'
#import 'fragments/provider_attribution_fields.graphql'
#import 'fragments/work_card.graphql'

query WorkDetail($id: ID!) {
  work(id: $id) {
    ...WorkCard
    sortTitle
    releaseDate
    overview
    tagline
    originalTitle
    metadataStatus
    lockedFields
    addedAt
    seriesTitle
    credits { personId name role character }
    tags(namespaces: ["parental", "genre"]) { id namespace display }
    userData { played positionMs playCount rating favorite lastPlayed }
    attributions { ...ProviderAttributionFields }
  }
  editions(workId: $id) { ...EditionFull }
}
