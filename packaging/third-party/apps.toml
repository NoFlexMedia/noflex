#
# Third-party code the apps ship that their package managers don't track: the
# libraries media_kit downloads prebuilt for each platform, and the bundled font.
# Kept by reading each build, not generated from it; packaging/AGENTS.md says how.
# `cargo xtask third-party sync` turns it into flutter/assets/licenses/.

# The media_kit commit this describes, as flutter/pubspec.lock resolves it.
media_kit = "c533e446755f51cf53c7e57aea873f2aa5355f81"

# Full license texts that notices refer to.
[text."LGPL-2.1"]
url = "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0/COPYING.LGPLv2.1"
sha256 = "b634ab5640e258563c536e658cad87080553df6f34f62269a21d554844e58bfe"

[text."LGPL-3.0"]
url = "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0/COPYING.LGPLv3"
sha256 = "da7eabb7bafdf7d3ae5e9f223aa5bdc1eece45ac569dc21b3b037520b4464768"

# LGPL-3.0 supplements it, so the two go together.
[text."GPL-3.0"]
url = "https://raw.githubusercontent.com/FFmpeg/FFmpeg/n6.0/COPYING.GPLv3"
sha256 = "8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903"

[text."Apache-2.0"]
url = "https://raw.githubusercontent.com/Mbed-TLS/mbedtls/v3.4.1/LICENSE"
sha256 = "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30"

