# What each platform's build carries. `source` is the build's own scripts and
# patches; each library's `url` and `sha256` pin the source it was built from,
# which a release publishes beside its builds. A library without them was built
# from a branch head, and its exact source can't be named.

# Everywhere: bundled with the app itself.
[build.app]
platforms = ["android", "ios", "macos", "windows", "linux"]

[[build.app.library]]
id = "inter"

