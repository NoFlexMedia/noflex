query Account {
  preferences @list(name: "Preferences") { userId key value updatedAt }
  apiKeys @list(name: "ApiKeys") { id userId name createdAt revokedAt }
  myDevices @list(name: "MyDevices") { id name smartTranscode maxBitrateBps lastSeenAt }
  mySessions @list(name: "MySessions") { id userId client device deviceId appVersion remoteAddr createdAt lastSeenAt expiresAt }
  myRestrictions { userId allowedParentalRatingIds allowUnrated maxStreamBitrateBps maxConcurrentTranscodes }
  myExternalIdentities @list(name: "MyExternalIdentities") { pluginId issuer subject userId username displayName email linkedAt }
  externalAuthProviders { id displayName }
  myPluginLinks @list(name: "MyPluginLinks") { pluginId keys updatedAt }
  exportJobs(first: 100) @list(name: "ExportJobs") { edges { node { ...ExportJobFields } } }
}

query ParentalTags @cache(policy: CacheOrNetwork) {
  tags(namespaces: ["parental"], first: 200) { nodes { tag { id display } workCount } }
}

mutation CreateExportJob($edition: ID!, $format: ExportFormat!) {
  createExportJob(editionId: $edition, format: $format) { ...ExportJobFields }
}
