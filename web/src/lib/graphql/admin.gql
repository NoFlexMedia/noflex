query Admin {
  libraries { ...LibraryFields }
  users @list(name: "Users") { ...UserFields }
  sessions { id userId client device remoteAddr createdAt lastSeenAt expiresAt }
  plugins {
    id
    displayName
    version
    apiVersion
    hooks
    capabilities
    license
    author
    homepage
    tasks { name intervalMs lastRunAt consecutiveFailures totalRuns }
    instanceRestarts
    circuitOpen
  }
  pluginOverrides { pluginId hook workKind priority adminSet }
}

mutation CreateLibrary($name: String!, $kind: LibraryKind!, $paths: [String!]!) {
  createLibrary(name: $name, kind: $kind, paths: $paths) { ...LibraryFields ...Libraries_insert }
}

mutation UpdateLibrary($id: ID!, $name: String, $kind: LibraryKind, $paths: [String!]) {
  updateLibrary(id: $id, name: $name, kind: $kind, paths: $paths) { ...LibraryFields }
}

mutation UpdateLibraryConfig($id: ID!, $languages: [String!], $providers: [String!], $excluded: [String!], $watch: Boolean, $schedule: ScanSchedule, $artwork: ArtworkPreference, $category: LibraryCategory) {
  updateLibraryConfig(id: $id, preferredLanguages: $languages, preferredProviders: $providers, excludedFolders: $excluded, watchEnabled: $watch, scanSchedule: $schedule, artworkPreference: $artwork, contentCategory: $category) { ...LibraryFields }
}
